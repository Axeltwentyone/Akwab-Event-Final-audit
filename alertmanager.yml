global:
  resolve_timeout: 5m

route:
  receiver: 'slack-alertes'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: 'slack-alertes'
    slack_configs:
      - api_url: 'SLACK_WEBHOOK_URL'
        channel: '#nouveau-canal'
        send_resolved: true
        title: "{{ .Status | toUpper }} — {{ .CommonAnnotations.resume }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"